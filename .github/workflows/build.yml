name: Build, Test and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress; tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: '6.8.3'

jobs:
  # -------------------------------------------------------------------------------------
  # Version: single source of truth is project(... VERSION x.y.z) in CMakeLists.txt.
  # A release tag must be exactly "v<that version>" so binaries, installer and tag agree.
  # -------------------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_release: ${{ steps.read.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version and validate the tag
        id: read
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          test -n "$version" || { echo "::error::project VERSION not found in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match CMakeLists.txt VERSION $version - bump the version (and VERSION.txt) before tagging"
              exit 1
            fi
            grep -q "^V${version}" VERSION.txt || { echo "::error::VERSION.txt has no entry V${version}"; exit 1; }
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version $version, release=${is_release:-false}"

  # -------------------------------------------------------------------------------------
  build-ubuntu:
    name: Ubuntu (GCC, Ninja)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the git hash in Version.h is meaningful

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtserialport'
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build xvfb libssl-dev \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 fonts-dejavu-core

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSU_BUILD_TESTS=ON -DSU_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install and deploy (Qt deploy script)
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/dist" --config Release
          test -x dist/bin/ComUtility
          test -f dist/bin/qt.conf
          # NO_UNSUPPORTED_PLATFORM_ERROR in CMakeLists.txt would let a no-op deploy pass silently,
          # so check that the Qt libraries and the xcb platform plugin really were copied.
          test -f dist/lib/libQt6Core.so.6
          test -f dist/lib/libQt6SerialPort.so.6
          test -f dist/lib/libQt6Widgets.so.6
          test -f dist/lib/libQt6Network.so.6
          test -f dist/plugins/platforms/libqxcb.so
          # SSH: libssh (built from source) and the OpenSSL crypto library it needs are bundled too.
          test -f dist/lib/libssh.so.4
          test -f dist/lib/libcrypto.so.3
          # Firmware tab: the bundled Rockchip upgrade_tool (third_party/ -> bin/tools) with its config.ini.
          test -x dist/bin/tools/upgrade_tool
          test -f dist/bin/tools/config.ini
          # libssh's own install rules also drop headers and CMake config files: not part of the package.
          rm -rf dist/include dist/lib/cmake dist/lib/pkgconfig dist/lib/libssh.so
          # libssh.so resolves libcrypto through its own RUNPATH ($ORIGIN), so the bundled copy is
          # used even on a distro without OpenSSL 3.
          readelf -d dist/lib/libssh.so.4 | grep -E 'RPATH|RUNPATH' | grep -q '\$ORIGIN'
          env -u LD_LIBRARY_PATH ldd dist/lib/libssh.so.4 | grep libcrypto | grep -qE "$PWD/dist/lib/"
          # The deploy tool sets RUNPATH=$ORIGIN/../lib on the installed binary. install-qt-action
          # exports LD_LIBRARY_PATH (which outranks RUNPATH), so check with it unset: every Qt lib
          # must resolve from dist/lib and nothing may be unresolved.
          readelf -d dist/bin/ComUtility | grep -E 'RPATH|RUNPATH' | grep -q '\$ORIGIN/../lib'
          env -u LD_LIBRARY_PATH ldd dist/bin/ComUtility
          ! env -u LD_LIBRARY_PATH ldd dist/bin/ComUtility | grep -q 'not found'
          # (RUNPATH resolution prints the path as dist/bin/../lib/, hence the optional "bin/../")
          env -u LD_LIBRARY_PATH ldd dist/bin/ComUtility | grep libQt6Core | grep -qE "$PWD/dist/(bin/\.\./)?lib/"
          env -u LD_LIBRARY_PATH ldd dist/bin/ComUtility | grep libssh | grep -qE "$PWD/dist/(bin/\.\./)?lib/"
          # and the package really starts on its own with the deployed xcb plugin (what end users
          # get): --version constructs QApplication, then prints the version and exits
          xvfb-run -a env -u LD_LIBRARY_PATH dist/bin/ComUtility --version
          file dist/bin/ComUtility
          # su-fw, the console tool (v0.6.0): next to the GUI, resolving everything from dist/lib, and
          # it starts (QCoreApplication: no display needed)
          test -x dist/bin/su-fw
          readelf -d dist/bin/su-fw | grep -E 'RPATH|RUNPATH' | grep -q '\$ORIGIN/../lib'
          ! env -u LD_LIBRARY_PATH ldd dist/bin/su-fw | grep -q 'not found'
          env -u LD_LIBRARY_PATH ldd dist/bin/su-fw | grep libQt6Core | grep -qE "$PWD/dist/(bin/\.\./)?lib/"
          env -u LD_LIBRARY_PATH dist/bin/su-fw --version | tee su-fw-version.txt
          grep -q "^su-fw ${{ needs.version.outputs.version }} " su-fw-version.txt
          env -u LD_LIBRARY_PATH dist/bin/su-fw --help | grep -q 'Exit codes:'
          find dist -type f | sort

      - name: Package tarball
        run: |
          mkdir -p out
          tar -czf "out/ComUtility-${{ needs.version.outputs.version }}-linux-x64.tar.gz" -C dist .
          ls -la out

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ComUtility-linux-x64
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------------------
  build-windows:
    name: Windows (MSVC 2022, Ninja)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        # OpenSSL 3 (libssh's crypto backend) is preinstalled on the runner image in a location
        # FindOpenSSL searches (C:\Program Files\OpenSSL); the configure summary prints which one.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl.exe -DSU_BUILD_TESTS=ON -DSU_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install and deploy (windeployqt)
        shell: pwsh
        run: |
          cmake --install build --prefix "$env:GITHUB_WORKSPACE\dist" --config Release
          $required = @('dist\bin\ComUtility.exe', 'dist\bin\su-fw.exe', 'dist\bin\qt.conf', 'dist\bin\Qt6Core.dll',
                        'dist\bin\Qt6SerialPort.dll', 'dist\bin\Qt6Widgets.dll', 'dist\bin\Qt6Network.dll',
                        'dist\bin\platforms\qwindows.dll',
                        # SSH: libssh built from source plus the OpenSSL crypto DLL it depends on
                        'dist\bin\ssh.dll', 'dist\bin\libcrypto-3-x64.dll',
                        # Firmware tab: the bundled flashing tools (third_party/ -> bin\tools)
                        'dist\bin\tools\upgrade_tool.exe', 'dist\bin\tools\license.txt',
                        'dist\bin\tools\adb.exe', 'dist\bin\tools\AdbWinApi.dll', 'dist\bin\tools\AdbWinUsbApi.dll',
                        'dist\bin\tools\DriverAssistant\DriverInstall.exe')
          # libssh's own install rules also drop its import library, headers and CMake files: not part of the package.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\include, dist\lib
          foreach ($f in $required) { if (-not (Test-Path $f)) { Write-Error "missing after deploy: $f"; exit 1 } }
          # su-fw (v0.6.0, console) starts from the deployed folder alone: no Qt SDK on PATH.
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $suFwVersion = & dist\bin\su-fw.exe --version
          $suFwRc = $LASTEXITCODE
          $suFwHelp = (& dist\bin\su-fw.exe --help) -join "`n"
          $env:PATH = $savedPath
          if ($suFwRc -ne 0 -or $suFwVersion -notmatch '^su-fw ${{ needs.version.outputs.version }} ') { Write-Error "su-fw --version failed ($suFwRc): $suFwVersion"; exit 1 }
          if ($suFwHelp -notmatch 'Exit codes:') { Write-Error "su-fw --help printed no exit codes"; exit 1 }
          Write-Host $suFwVersion
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item README.md, VERSION.txt dist\bin\
          Compress-Archive -Path dist\bin\* -DestinationPath "out\ComUtility-${{ needs.version.outputs.version }}-windows-x64.zip" -CompressionLevel Optimal
          Get-ChildItem out

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\bin" "/DOutputDir=$env:GITHUB_WORKSPACE\out" packaging\windows\ComUtility.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ComUtility-windows-x64
          path: |
            out/*.zip
            out/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------------------
  # macOS: one native build per processor (Apple Silicon on macos-15, Intel on macos-15-intel),
  # each packaged as a disk image with ComUtility.app (su-fw inside it). OpenSSL is built from
  # source for macOS 12 and later (Homebrew's copy would require the runner's own macOS version)
  # and cached per version and processor.
  # -------------------------------------------------------------------------------------
  build-macos:
    name: macOS ${{ matrix.label }} (Apple Clang, Ninja)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            arch: arm64
            suffix: arm64
          - label: Intel
            runner: macos-15-intel
            arch: x86_64
            suffix: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash   # explicit: bash -eo pipefail (the implicit default has no pipefail)
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      OPENSSL_VERSION: '3.5.9'
      OPENSSL_SHA256: '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtserialport'
          cache: true

      - name: Install build tools
        run: brew install ninja || true; ninja --version; cmake --version | head -n1

      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ matrix.arch }}

      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }} (shared, macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }}+)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -m 300 -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | shasum -a 256 -c -
          tar -xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure "darwin64-${{ matrix.arch }}-cc" shared no-tests --prefix="$HOME/openssl" --libdir=lib
          make -j"$(sysctl -n hw.ncpu)" build_sw > build.log 2>&1 || { tail -n 80 build.log; exit 1; }
          make install_sw > install.log 2>&1 || { tail -n 40 install.log; exit 1; }

      - name: Check OpenSSL
        run: |
          lib="$HOME/openssl/lib/libcrypto.3.dylib"
          test -f "$lib"
          test "$(lipo -archs "$lib")" = "${{ matrix.arch }}"
          vtool -show-build "$lib" | grep -E 'minos +12\.0'

      - name: Configure
        # Warnings are reported below, not fatal: this is the first Apple Clang build of the code
        # (GCC and MSVC builds treat warnings as errors).
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DOPENSSL_ROOT_DIR="$HOME/openssl"
          -DSU_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release 2>&1 | tee build.log
          # Apple Clang warnings in the project's own code (libssh's are its own business).
          grep -E '^/.*: warning: ' build.log | grep -v '/_deps/' | sort -u > warnings.txt || true
          count=$(wc -l < warnings.txt | tr -d ' ')
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count Apple Clang warning(s) in ComUtility code"
            head -n 50 warnings.txt
          fi

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install and deploy (macdeployqt)
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/dist" --config Release
          # libssh's own install rules also drop headers, CMake files and a second libssh copy.
          rm -rf dist/include dist/lib
          app=dist/ComUtility.app
          test -x "$app/Contents/MacOS/ComUtility"
          test -x "$app/Contents/MacOS/su-fw"
          test -f "$app/Contents/Resources/qt.conf"
          test -f "$app/Contents/Resources/comutility.icns"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${{ needs.version.outputs.version }}"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "us.moses-ai.comutility"
          for fw in QtCore QtGui QtWidgets QtSvg QtSerialPort QtNetwork; do
            test -d "$app/Contents/Frameworks/$fw.framework" || { echo "::error::missing $fw.framework"; exit 1; }
          done
          test -f "$app/Contents/Frameworks/libssh.4.dylib"
          test -f "$app/Contents/Frameworks/libcrypto.3.dylib"
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          # Every Mach-O file in the bundle: the right processor, macOS 12 or later, and only
          # references into the bundle or to the system (no Qt SDK, no OpenSSL build folder).
          bad=0
          while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            archs=$(lipo -archs "$f")
            echo "$archs" | grep -qw "${{ matrix.arch }}" || { echo "::error::$f lacks ${{ matrix.arch }} ($archs)"; bad=1; continue; }
            # (the Qt frameworks are universal: look at this job's processor only)
            for m in $(vtool -arch "${{ matrix.arch }}" -show-build "$f" 2>/dev/null | awk '/minos/{print $2}'); do
              [ "$(printf '%s\n' "$m" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n1)" = "$MACOSX_DEPLOYMENT_TARGET" ] \
                || { echo "::error::$f needs macOS $m"; bad=1; }
            done
            while IFS= read -r dep; do
              case "$dep" in
                @rpath/*|@executable_path/*|@loader_path/*|/usr/lib/*|/System/*) ;;
                *) echo "::error::$f references $dep"; bad=1 ;;
              esac
            done < <(otool -arch "${{ matrix.arch }}" -L "$f" | tail -n +2 | awk '{print $1}')
          done < <(find "$app" -type f)
          for exe in ComUtility su-fw; do
            rpaths=$(otool -l "$app/Contents/MacOS/$exe" | awk '/cmd LC_RPATH/{getline; getline; print $2}')
            echo "$exe rpaths:" $rpaths
            echo "$rpaths" | grep -qxE '@(executable|loader)_path/\.\./Frameworks/?' || { echo "::error::$exe has no rpath to Frameworks"; bad=1; }
            if echo "$rpaths" | grep -qv '^@'; then echo "::error::$exe keeps an absolute rpath"; bad=1; fi
          done
          test "$bad" = 0
          codesign --verify --deep --strict --verbose=2 "$app"
          # The bundle starts on its own: the Qt SDK and the OpenSSL build are moved out of the way
          # (and put back for the cache), so nothing outside the bundle can be picked up.
          test -n "$QT_ROOT_DIR" && test -d "$QT_ROOT_DIR"
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"; mv "$HOME/openssl" "$HOME/openssl.hidden"
          trap 'mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"; mv "$HOME/openssl.hidden" "$HOME/openssl"' EXIT
          clean_env="env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH"
          $clean_env "$app/Contents/MacOS/ComUtility" --version
          $clean_env "$app/Contents/MacOS/su-fw" --version | tee su-fw-version.txt
          grep -q "^su-fw ${{ needs.version.outputs.version }} " su-fw-version.txt
          $clean_env "$app/Contents/MacOS/su-fw" --help | grep -q 'Exit codes:'
          find dist -maxdepth 4 | sort

      - name: Package disk image
        run: |
          version="${{ needs.version.outputs.version }}"
          dmg="out/ComUtility-${version}-macos-${{ matrix.suffix }}.dmg"
          mkdir -p out dmgroot
          ditto dist/ComUtility.app dmgroot/ComUtility.app
          cp README.md VERSION.txt dmgroot/
          ln -s /Applications dmgroot/Applications
          # hdiutil now and then fails on the hosted runners with "Resource busy": three tries.
          for try in 1 2 3; do
            hdiutil create -volname "ComUtility ${version}" -srcfolder dmgroot -fs HFS+ -format UDZO -ov "$dmg" && break
            echo "hdiutil create failed (try $try)"; sleep 10
          done
          test -f "$dmg"
          # the image mounts and holds a bundle with a valid signature
          mkdir -p "$RUNNER_TEMP/cu"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/cu" "$dmg"
          codesign --verify --deep --strict "$RUNNER_TEMP/cu/ComUtility.app"
          test -x "$RUNNER_TEMP/cu/ComUtility.app/Contents/MacOS/su-fw"
          hdiutil detach "$RUNNER_TEMP/cu"
          ls -la out

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ComUtility-macos-${{ matrix.suffix }}
          path: out/*.dmg
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------------------
  # Release: only for tags v<version>. Publishes the Linux tarball, the Windows portable zip,
  # the Windows installer and the two macOS disk images with SHA-256 checksums and notes taken
  # from VERSION.txt.
  # -------------------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [version, build-ubuntu, build-windows, build-macos]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for VERSION.txt)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes and checksums
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir -p release
          mv artifacts/*.tar.gz artifacts/*.zip artifacts/*-setup.exe artifacts/*.dmg release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          {
            echo "## ComUtility ${version}"
            echo
            # the block of VERSION.txt that belongs to this version (from "V<version>" up to the next "V" heading)
            awk -v v="V${version}" '
              $0 ~ "^"v { on=1; next }
              /^V[0-9]/ { if (on) exit }
              on { sub(/^\t/, "- "); print }
            ' VERSION.txt
            echo
            echo "### Downloads"
            echo
            echo "| File | Contents |"
            echo "|---|---|"
            echo "| \`ComUtility-${version}-windows-x64-setup.exe\` | Windows installer (x64) |"
            echo "| \`ComUtility-${version}-windows-x64.zip\` | Windows portable build (unzip and run) |"
            echo "| \`ComUtility-${version}-linux-x64.tar.gz\` | Linux x86-64 build with Qt libraries (run \`bin/ComUtility\`; the command-line tool is \`bin/su-fw\`) |"
            echo "| \`ComUtility-${version}-macos-arm64.dmg\` | macOS 12 or later, Apple Silicon (M1 and newer) |"
            echo "| \`ComUtility-${version}-macos-x64.dmg\` | macOS 12 or later, Intel |"
            echo "| \`SHA256SUMS.txt\` | checksums |"
            echo
            echo "Built with Qt ${QT_VERSION}. Windows: MSVC 2022, requires the Visual C++ 2022 runtime (\`vc_redist.x64.exe\` is included)."
            echo
            echo "macOS: open the disk image and drag ComUtility to Applications. The app is not notarized by Apple, so the first start is refused once: open System Settings > Privacy & Security and choose **Open Anyway**. The command-line tool is \`/Applications/ComUtility.app/Contents/MacOS/su-fw\`. The Rockchip flashing tools are not included on macOS (Rockchip ships them for Windows and Linux only); adb is taken from PATH or set in Preferences."
          } > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ComUtility ${{ needs.version.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.tar.gz
            release/*.zip
            release/*-setup.exe
            release/*.dmg
            release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
